version: 1
disable_existing_loggers: False

formatters:
  default:
    (): "uvicorn.logging.DefaultFormatter"
    fmt: "%(levelprefix)s %(message)s"
    use_colors: null
  access:
    (): "uvicorn.logging.AccessFormatter"
    fmt: '%(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s'
    use_colors: null
  detailed:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
  app_handler:
    formatter: detailed
    class: logging.StreamHandler
    stream: ext://sys.stdout

loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: False
  uvicorn.error:
    handlers: [default]
    level: INFO
    propagate: False
  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: False
  __main__:
    handlers: [app_handler]
    level: INFO
    propagate: False
  app.handlers.chinese_audio_openai_handler:
    handlers: [app_handler]
    level: DEBUG
    propagate: False
  app.handlers.chinese_audio_bytedance_handler:
    handlers: [app_handler]
    level: DEBUG
    propagate: False

root:
  level: INFO
  handlers: [default]
