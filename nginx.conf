worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Define the group of application servers
    upstream app_servers {
        # This is the key for sticky sessions.
        # It ensures that a client with a specific IP address will always be
        # sent to the same server, which is critical for WebSocket connections.
        ip_hash;

        # The service name 'app' is used here, which Docker Compose will
        # resolve to the IP addresses of the running app containers.
        # The service name 'app' is used here, which Docker Compose will
        # resolve to the IP addresses of the running app containers.
        # The port 5050 matches the port the app service is running on.
        server app:5050;
        server app:5050;
        server app:5050;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://app_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location / {
            proxy_pass http://app_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket specific headers
            # These are required to properly upgrade the connection from HTTP to WebSocket.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
